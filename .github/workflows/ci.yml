name: macOS build and offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build universal app
        run: ./scripts/build.sh
      - name: Run offline checks (no privileged interception)
        run: ./scripts/test.sh
      - name: Verify universal binaries and bundle signature
        run: |
          lipo 'dist/Zapret macOS.app/Contents/MacOS/ZapretMac' -verify_arch arm64 x86_64
          lipo 'dist/Zapret macOS.app/Contents/Resources/zapret-packet' -verify_arch arm64 x86_64
          codesign --verify --deep --strict 'dist/Zapret macOS.app'
